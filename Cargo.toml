[package]
name = "coldpack"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
description = "Glacier Deep Archive backup CLI for personal NAS disaster recovery"

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1"
dirs = "5"
walkdir = "2"
xxhash-rust = { version = "0.8", features = ["xxh3"] }
tar = "0.4"
indicatif = "0.17"
aws-config = { version = "1", features = ["behavior-version-latest"] }
aws-sdk-s3 = "1"
aws-smithy-types = "1"
tokio = { version = "1", features = ["full"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[profile.release]
lto = true
strip = true
codegen-units = 1
